<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .error-msg {
            color: red;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
        #regLink {
            margin-top: 12px;
            font-size: 14px;
        }
        #regLink a {
            color: #03398a;
            font-weight: bold;
            text-decoration: none;
        }
        #regLink a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">Skip to Content</a>
    <main id="main">
    <form action="../../backend/api/login_process.php" method="post" id="loginForm">
        <div id="mainbox">
            <img id="logo" src="../image/charusat_logo.png" alt="CHARUSAT Logo">
            <h1>CHARUSAT Student Login</h1>
            <div id="box">
                <label for="username">
                    <b>Student ID, Username, or Email</b>
                </label>
                <input type="text"
                       placeholder="Student ID, username, or email"
                       id="username"
                       name="username"
                       autocomplete="username"
                       required>
                <div id="usernameError" class="error-msg" role="alert"></div>
                <br><br>
                <label for="password">
                    <b>Password</b>
                </label>
                <input type="password"
                       placeholder="password"
                       id="password"
                       name="password"
                       autocomplete="current-password"
                       required>
                <div id="passwordError" class="error-msg" role="alert"></div>
                <label for="rememberMe" style="display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;">
                    <input type="checkbox" id="rememberMe" name="remember_me" value="1">
                    Remember me on this device
                </label>
            </div>
            <p id="for">
                <a href="faq.html" id="forget">
                    Forget password?
                </a>
            </p>
            <input type="submit" value="Login" id="sub">
            <div id="regLink">
                New Student? <a href="register.html">Register here</a>
            </div>
            <div style="margin-top: 8px;">
                <a href="../index.html" id="backHome">&larr; Back to Home</a>
            </div>
        </div>
    </form>
    </main>
    <script src="../js/Login_page.js"></script>
</body>
</html>
