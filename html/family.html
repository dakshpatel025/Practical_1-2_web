<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Details</title>

    <link rel="stylesheet" href="../css/family_style.css">

    <!-- Small Internal CSS -->
    <style>
        .required {
            color: red;
        }

        .photo-preview {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div id="text" style="color: aliceblue;">
        Student Hub Portal
    </div>

    <div id="space">

    </div>

    <div id="nav">
        <nav>
            <a href="family.html"> <input type="button" value="Family" class="input_nav"> </a>
            <a href="semester_result.html"> <input type="button" value="Semester result" class="input_nav"> </a>
            <a href="main_page.html"> <input type="button" value="Main Page" class="input_nav"> </a>
            <a href="Student_hostel.html"> <input type="button" value="Student hostel" class="input_nav"> </a>
            <a href="Student_Payment.html"> <input type="button" value="Payment detail" class="input_nav"> </a>
            <a href="Student_time-table.html"> <input type="button" value="Time - table" class="input_nav"> </a>
            <a href="course_details.html"> <input type="button" value="Course" class="input_nav"> </a>
        </nav>
    </div>

<div class="family-container">

    <!-- Father Box -->
    <div class="family-box">

        <div class="box-heading">
            <h2>Father Details</h2>
        </div>

        <div class="details-content">

            <div class="form-area">

                <label>Father Name <span class="required">*</span></label>

                <div class="name-inputs">
                    <input type="text" placeholder="First name" class="input_details" required>
                    <input type="text" placeholder="Middle name" class="input_details">
                    <input type="text" placeholder="Last name" class="input_details" required>
                </div>

                <label>Father Mobile <span class="required">*</span></label>

                <input
                    type="tel"
                    class="mobile input_details"
                    placeholder="Mobile number"
                    maxlength="10"
                    required
                >

                <label>Father Occupation</label>

                <input
                    type="text"
                    class="occupation input_details"
                    placeholder="Occupation"
                >

            </div>


            <!-- Father Photo -->
            <div class="photo-area">

                <label>Father Photo</label>

                <div class="photo-box">
                    <span id="fatherText">Father Photo</span>
                    <img id="fatherPreview" class="photo-preview">
                </div>

                <input
                    type="file"
                    id="fatherPhoto"
                    accept="image/*"
                    class="input_details"
                    hidden
                >

                <button
                    type="button"
                    onclick="document.getElementById('fatherPhoto').click()"
                >
                    Choose Photo
                </button>

            </div>

        </div>

    </div>


    <!-- Mother Box -->
    <div class="family-box">

        <div class="box-heading">
            <h2>Mother Details</h2>
        </div>

        <div class="details-content">

            <div class="form-area">

                <label>Mother Name <span class="required">*</span></label>

                <div class="name-inputs">
                    <input type="text" placeholder="First name" class="input_details" required>
                    <input type="text" placeholder="Middle name" class="input_details" >
                    <input type="text" placeholder="Last name" class="input_details" required>
                </div>

                <label>Mother Mobile <span class="required">*</span></label>

                <input
                    type="tel"
                    class="mobile input_details"
                    placeholder="Mobile number"
                    maxlength="10"
                    required
                >

                <label>Mother Occupation</label>

                <input
                    type="text"
                    class="occupation input_details"
                    placeholder="Occupation"
                >

            </div>


            <!-- Mother Photo -->
            <div class="photo-area">

                <label>Mother Photo</label>

                <div class="photo-box">
                    <span id="motherText">Mother Photo</span>
                    <img id="motherPreview" class="photo-preview">
                </div>

                <input
                    type="file"
                    id="motherPhoto"
                    accept="image/*"
                    class="input_details"
                    hidden
                >

                <button
                    type="button"
                    onclick="document.getElementById('motherPhoto').click()"
                >
                    Choose Photo
                </button>

            </div>

        </div>

    </div>

</div>


<script>

    // Father photo preview
    document.getElementById("fatherPhoto").addEventListener("change", function () {

        let file = this.files[0];

        if (file) {
            let reader = new FileReader();

            reader.onload = function (e) {
                document.getElementById("fatherPreview").src = e.target.result;
                document.getElementById("fatherPreview").style.display = "block";
                document.getElementById("fatherText").style.display = "none";
            };

            reader.readAsDataURL(file);
        }
    });


    // Mother photo preview
    document.getElementById("motherPhoto").addEventListener("change", function () {

        let file = this.files[0];

        if (file) {
            let reader = new FileReader();

            reader.onload = function (e) {
                document.getElementById("motherPreview").src = e.target.result;
                document.getElementById("motherPreview").style.display = "block";
                document.getElementById("motherText").style.display = "none";
            };

            reader.readAsDataURL(file);
        }
    });

</script>

</body>
</html>
