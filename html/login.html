<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <form action="main_page.html" id="loginForm">

        <div id="mainbox">

            <img id="logo" src="../image/charusat_logo.png">

            <h1>Login charusat</h1>

            <div id="box">

                <label for="username">
                    <b style="font-size: 20px;">Username :</b>
                </label>

                <input type="text"
                       placeholder="username"
                       id="username"
                       name="username">

                <br>

                <label for="password">
                    <b style="font-size: 20px;">Password :</b>
                </label>

                <input type="password"
                       placeholder="password"
                       id="password"
                       name="password">

            </div>

            <p id="for">
                <a href="https://www.google.com/" id="forget">
                    Forget password?
                </a>
            </p>

            <br>

            <input type="submit" value="Login" id="sub">

        </div>

    </form>

    <script src="../js/Login_page.js"></script>

</body>
</html>
