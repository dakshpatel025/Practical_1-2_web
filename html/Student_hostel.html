<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hostel Details</title>

    <link rel="stylesheet" href="../css/hostel.css">

    <style>
        .required {
            color: red;
        }
    </style>
</head>

<body>

    <div id="text" style="color: aliceblue;">
        Student Hub Portal
    </div>

    <div id="space">

    </div>

    <div id="nav">
        <nav>
            <a href="family.html"> <input type="button" value="Family detail" class="input_nav"> </a>
            <a href="semester_result.html"> <input type="button" value="Semester result" class="input_nav"> </a>
            <a href="Student_attendance.html"> <input type="button" value="Attendance" class="input_nav"> </a>
            <a href="main_page.html"> <input type="button" value="Main Page" class="input_nav"> </a>
            <a href="Student_Payment.html"> <input type="button" value="Payment detail" class="input_nav"> </a>
            <a href="Student_time-table.html"> <input type="button" value="Time - table" class="input_nav"> </a>
            <a href="course_details.html"> <input type="button" value="Course" class="input_nav"> </a>
        </nav>
    </div>

    <div class="hostel-container">

        <h1>Hostel Details</h1>

        <div class="form-row">
            <label>Hostel Name :</label>
            <input type="text" placeholder="Hostel name" class="input_details">
        </div>

        <div class="form-row">
            <label>Hostel Address :</label>
            <input type="text" placeholder="Hostel Address" class="input_details">
        </div>

        <div class="form-row">
            <label>Hostel Mobile :</label>
            <input type="tel" placeholder="Mobile No." maxlength="10" class="input_details">
        </div>

        <div class="form-row">
            <label>Hostel Type :</label>

            <select>
                <option value="">Select Hostel Type</option>
                <option>College Hostel</option>
                <option>Private Hostel</option>
                <option>PG</option>
            </select>
        </div>

        <div class="form-row">
            <label>Room Number :</label>
            <input type="text" placeholder="Room No." class="input_details">
        </div>

        <div class="form-row">
            <label>Room Type :</label>

            <select>
                <option value="">Select Room Type</option>
                <option>Single Sharing</option>
                <option>Double Sharing</option>
                <option>Triple Sharing</option>
                <option>Four Sharing</option>
            </select>
        </div>

        <div class="section-title">
            <h2>Hostel Owner Details</h2>
        </div>

        <div class="form-row">
            <label>Owner Name :</label>

            <div class="name-inputs">
                <input type="text" placeholder="First name" class="input_details">
                <input type="text" placeholder="Middle name" class="input_details">
                <input type="text" placeholder="Last name" class="input_details">
            </div>
        </div>

        <div class="form-row">
            <label>Owner Mobile :</label>
            <input type="tel" placeholder="Mobile No." maxlength="10" class="input_details">
        </div>

        <div class="section-title">
            <h2>Warden Details</h2>
        </div>

        <div class="form-row">
            <label>Warden Name :</label>
            <input type="text" placeholder="Warden name" class="input_details">
        </div>

        <div class="form-row">
            <label>Warden Mobile :</label>
            <input type="tel" placeholder="Mobile No." maxlength="10" class="input_details">
        </div>

        <div class="section-title">
            <h2>Other Details</h2>
        </div>

        <div class="form-row">
            <label>Monthly Fees :</label>
            <input type="number" placeholder="₹ Monthly fees" class="input_details">
        </div>

        <div class="form-row">
            <label>Mess Facility :</label>

            <label class="radio">
                <input type="radio" name="mess" class="input_details"> Yes
            </label>

            <label class="radio">
                <input type="radio" name="mess" class="input_details"> No
            </label>
        </div>

        <div class="form-row">
            <label>Hostel Facilities :</label>

            <div class="checkboxes">
                <label>
                    <input type="checkbox"> Wi-Fi
                </label>

                <label>
                    <input type="checkbox"> Laundry
                </label>

                <label>
                    <input type="checkbox"> Parking
                </label>

                <label>
                    <input type="checkbox"> Security
                </label>
            </div>
        </div>

        <div class="form-row">
            <label>Hostel Related Query :</label>

            <textarea placeholder="Enter your query"></textarea>
        </div>

        <div class="form-row">
            <label>Comfortable with Hostel :</label>

            <label class="radio">
                <input type="radio" name="comfortable"> Yes
            </label>

            <label class="radio">
                <input type="radio" name="comfortable"> No
            </label>
        </div>

        <div class="buttons">
            <button type="submit">Save</button>
            <button type="reset" class="clear">Clear</button>
        </div>

    </div>

</body>
</html>
